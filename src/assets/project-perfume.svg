<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Perfume campaign luxury advertising mockup</title>
  <desc id="desc">Fragrance bottle, social campaign cards and luxury advertising composition.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop stop-color="#fff4e7"/>
      <stop offset=".62" stop-color="#d4b99e"/>
      <stop offset="1" stop-color="#17130f"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1600" height="1100" fill="url(#glow)"/>
  <rect x="170" y="190" width="460" height="720" fill="#17130f" opacity=".95" filter="url(#shadow)"/>
  <text x="235" y="350" fill="#f7efe2" font-family="Georgia, serif" font-size="74">AMBRE</text>
  <text x="236" y="420" fill="#f7efe2" font-family="Georgia, serif" font-size="74">NOIR</text>
  <line x1="240" y1="474" x2="510" y2="474" stroke="#b65324" stroke-width="5"/>
  <text x="240" y="540" fill="#d9ccbb" font-family="Arial, Helvetica, sans-serif" font-size="23">FRAGRANCE CAMPAIGN</text>
  <rect x="780" y="235" width="310" height="600" rx="60" fill="#f7efe2" fill-opacity=".68" stroke="#fffaf0" stroke-width="8" filter="url(#shadow)"/>
  <rect x="850" y="152" width="168" height="120" rx="20" fill="#17130f"/>
  <rect x="835" y="460" width="200" height="170" fill="#17130f"/>
  <text x="872" y="548" fill="#f7efe2" font-family="Georgia, serif" font-size="44">AN</text>
  <text x="865" y="596" fill="#b65324" font-family="Arial, Helvetica, sans-serif" font-size="18">EAU DE PARFUM</text>
  <rect x="1135" y="260" width="260" height="350" fill="#fffaf0" transform="rotate(8 1265 435)" filter="url(#shadow)"/>
  <rect x="1180" y="315" width="170" height="185" fill="#b65324" opacity=".85" transform="rotate(8 1265 435)"/>
  <text x="1190" y="555" fill="#17130f" font-family="Arial, Helvetica, sans-serif" font-size="22" transform="rotate(8 1265 435)">SOCIAL AD</text>
  <rect x="1010" y="675" width="360" height="205" fill="#f7efe2" filter="url(#shadow)"/>
  <text x="1060" y="790" fill="#17130f" font-family="Georgia, serif" font-size="48">Launch Visuals</text>
  <text x="1062" y="837" fill="#8e3f21" font-family="Arial, Helvetica, sans-serif" font-size="20">PRODUCT / PROMO / CAMPAIGN</text>
</svg>
